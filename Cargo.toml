[package]
name = "datazen-plugin-olap"
version = "0.0.7"
edition = "2021"
description = "Presto/Trino OLAP driver plugin for DataZen"

[dependencies]
datazen-driver-api = { git = "https://github.com/flyxl/datazen-driver-api.git" }
async-trait = "0.1"
prusto = { version = "0.5.2", features = ["presto"] }
trino-rust-client = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
